<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WeChat Article Clipper</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="#22c55e" stroke-width="2" stroke-linejoin="round"/>
          <polyline points="14 2 14 8 20 8" stroke="#22c55e" stroke-width="2" stroke-linejoin="round"/>
          <line x1="16" y1="13" x2="8" y2="13" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
          <line x1="16" y1="17" x2="8" y2="17" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
          <polyline points="10 9 9 9 8 9" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="logo-text">Article Clipper</span>
      </div>
    </header>

    <!-- Not a WeChat article page -->
    <div id="not-wechat" class="section hidden">
      <div class="empty-state">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="#4b5563" stroke-width="2"/>
          <line x1="12" y1="8" x2="12" y2="12" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
          <line x1="12" y1="16" x2="12.01" y2="16" stroke="#4b5563" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <p class="empty-text">请打开微信公众号文章页面</p>
        <p class="empty-sub">支持 mp.weixin.qq.com/s/... 格式的链接</p>
      </div>
    </div>

    <!-- Article info + controls -->
    <div id="main-panel" class="section hidden">
      <div id="article-info" class="article-info">
        <div class="article-title" id="article-title"></div>
        <div class="article-meta" id="article-meta"></div>
      </div>

      <div class="divider"></div>

      <div class="options">
        <label class="option-label">
          <input type="checkbox" id="include-images" checked />
          <span class="checkmark"></span>
          <span>下载图片（生成 ZIP）</span>
        </label>
      </div>

      <button id="convert-btn" class="btn btn-primary">
        <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="7 10 12 15 17 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="12" y1="15" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span id="btn-text">转换并下载</span>
      </button>

      <!-- Progress -->
      <div id="progress-section" class="progress-section hidden">
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <div id="progress-label" class="progress-label">处理中...</div>
      </div>

      <!-- Status message -->
      <div id="status-msg" class="status-msg hidden"></div>
    </div>
  </div>

  <script src="vendor/turndown.umd.js"></script>
  <script src="vendor/jszip.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
